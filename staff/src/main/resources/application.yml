spring:
  application:
    name: staff

  datasource:
    url: jdbc:postgresql://localhost:5433/service1_db
    username: hruser
    password: hrpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public
