services:
  postgres-hr:
    image: postgres:16.1
    environment:
      POSTGRES_DB: service1_db
      POSTGRES_USER: hruser
      POSTGRES_PASSWORD: hrpass
    ports:
      - "5433:5432"
    volumes:
      - postgres-hr-data:/var/lib/postgresql/data

  postgres-reference:
    image: postgres:16.1
    environment:
      POSTGRES_DB: service2_db
      POSTGRES_USER: refuser
      POSTGRES_PASSWORD: refpass
    ports:
      - "5434:5432"
    volumes:
      - postgres-ref-data:/var/lib/postgresql/data

  postgres-payroll:
    image: postgres:16.1
    environment:
      POSTGRES_DB: service3_db
      POSTGRES_USER: payrolluser
      POSTGRES_PASSWORD: payrollpass
    ports:
      - "5435:5432"
    volumes:
      - postgres-payroll-data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  staff:
    build:
      context: ./staff
      dockerfile: Dockerfile
    depends_on:
      - postgres-hr
      - kafka
      - handbook
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-hr:5432/service1_db
      SPRING_DATASOURCE_USERNAME: hruser
      SPRING_DATASOURCE_PASSWORD: hrpass

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HANDBOOK_BASE_URL: http://handbook:8081
    ports:
      - "8080:8080"

  handbook:
    build:
      context: ./handbook
      dockerfile: Dockerfile
    depends_on:
      - postgres-reference
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-reference:5432/service2_db
      SPRING_DATASOURCE_USERNAME: refuser
      SPRING_DATASOURCE_PASSWORD: refpass
    ports:
      - "8081:8081"
  calculations:
    build:
      context: ./calculations
      dockerfile: Dockerfile
    depends_on:
      - postgres-payroll
      - kafka
      - handbook
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payroll:5432/service3_db
      SPRING_DATASOURCE_USERNAME: payrolluser
      SPRING_DATASOURCE_PASSWORD: payrollpass

      HANDBOOK_BASE_URL: http://service2:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"

volumes:
  postgres-hr-data:
  postgres-ref-data:
  postgres-payroll-data:
