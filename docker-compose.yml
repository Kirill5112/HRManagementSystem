version: '3.8'

services:
  postgres-hr:
    image: postgres:16.1
    environment:
      POSTGRES_DB: service1_db
      POSTGRES_USER: hruser
      POSTGRES_PASSWORD: hrpass
    ports:
      - "5433:5432"
    volumes:
      - postgres-hr-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hruser"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-reference:
    image: postgres:16.1
    environment:
      POSTGRES_DB: service2_db
      POSTGRES_USER: refuser
      POSTGRES_PASSWORD: refpass
    ports:
      - "5434:5432"
    volumes:
      - postgres-ref-data:/var/lib/postgresql/data

  postgres-payroll:
    image: postgres:16.1
    environment:
      POSTGRES_DB: service3_db
      POSTGRES_USER: payrolluser
      POSTGRES_PASSWORD: payrollpass
    ports:
      - "5435:5432"
    volumes:
      - postgres-payroll-data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7.2.4-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-hr-data:
  postgres-ref-data:
  postgres-payroll-data:
